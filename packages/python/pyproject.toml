[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiery_python"
version = "0.0.1"
description = "Shared core, FastAPI helpers, enums, services, and utils for Focus Python apps"
requires-python = ">=3.13"
dependencies = [
  "python-dotenv>=1.0.0",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.10.0",
  "numpy>=1.26.0",
  "pandas>=3.0.5",
  "scipy>=1.18.1",
  "safetensors>=0.8.0",
  "mlflow[db]>=3.16.1",
  "sentry-sdk>=2.70.0",
  "structlog>=24.0.0",
  "redis>=5.0.0",
  "rq>=2.0.0",
  "fastapi>=0.100.0",
  "requests>=2.31.0",
  "boto3>=1.43.0",
  "joblib>=1.3.0",
  "httpx>=0.27.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "uvicorn>=0.20.0",
  "huggingface-hub>=1.16.1",
  "datasets>=4.0.0",
  "modal>=1.5.4",
  "torch>=2.13.0",
  "torchao>=0.18.0",
  "timm>=1.0.28",
  "peft>=0.20.0",
  "webdataset>=1.0.2",
  "h5py>=3.14.0",
  "pillow>=12.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
